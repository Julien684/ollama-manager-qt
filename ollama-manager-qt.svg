<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdb6b"/>
      <stop offset="0.5" stop-color="#e8a01c"/>
      <stop offset="1" stop-color="#a86a00"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>

  <!-- ================= LAMA BLANC ================= -->
  <g id="llama" stroke="#1c1c1e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- Queue -->
    <path d="M 70 130 C 50 124 44 148 58 158" fill="url(#fur)" stroke-width="7"/>

    <!-- Pattes -->
    <g fill="url(#fur)">
      <rect x="76" y="158" width="17" height="74" rx="8"/>
      <rect x="101" y="158" width="17" height="74" rx="8"/>
      <rect x="136" y="158" width="17" height="74" rx="8"/>
      <rect x="161" y="158" width="17" height="74" rx="8"/>
    </g>
    <g fill="#1c1c1e" stroke="none">
      <rect x="76" y="220" width="17" height="12" rx="6"/>
      <rect x="101" y="220" width="17" height="12" rx="6"/>
      <rect x="136" y="220" width="17" height="12" rx="6"/>
      <rect x="161" y="220" width="17" height="12" rx="6"/>
    </g>

    <!-- Corps -->
    <rect x="62" y="110" width="120" height="68" rx="34" fill="url(#fur)"/>

    <!-- Cou -->
    <path d="M 146 132 L 157 60 L 191 60 L 187 132 Z" fill="url(#fur)" stroke-width="7"/>

    <!-- Oreilles -->
    <path d="M 157 56 L 155 24 Q 155 17 162 17 L 168 17 Q 175 17 175 24 L 174 56 Z"
          fill="url(#fur)" stroke-width="6"/>
    <path d="M 183 56 L 183 22 Q 183 16 190 16 L 196 16 Q 203 16 203 23 L 202 56 Z"
          fill="url(#fur)" stroke-width="6"/>

    <!-- Tete -->
    <path d="M 149 52 Q 149 38 163 38 L 196 38 Q 211 38 211 53 L 211 78 Q 211 93 196 93
             L 165 93 Q 149 93 149 78 Z" fill="url(#fur)" stroke-width="6"/>

    <!-- Museau -->
    <ellipse cx="205" cy="72" rx="14" ry="16" fill="#f6f6f6" stroke-width="5"/>
    <circle cx="205" cy="68" r="3.6" fill="#1c1c1e" stroke="none"/>
    <path d="M 200 80 Q 205 85 210 80" fill="none" stroke-width="3"/>

    <!-- Oeil -->
    <circle cx="185" cy="59" r="6.5" fill="#1c1c1e" stroke="none"/>
    <circle cx="187" cy="57" r="2" fill="#ffffff" stroke="none"/>
  </g>

  <!-- ================= CLE A MOLETTE ================= -->
  <g transform="translate(118,156) rotate(-24) scale(0.62)" opacity="0.20" stroke="none">
    <rect x="-96" y="-10" width="190" height="26" rx="13" fill="#000"/>
    <circle cx="-118" cy="3" r="33" fill="#000"/>
  </g>
  <g transform="translate(118,156) rotate(-24) scale(0.62)" stroke="#7d4d00" stroke-width="3">
    <!-- Manche -->
    <rect x="-96" y="-12" width="186" height="25" rx="12" fill="url(#gold)"/>
    <rect x="-88" y="-8" width="168" height="6" rx="3" fill="#ffffff" opacity="0.35" stroke="none"/>
    <!-- Tete creuse -->
    <g transform="translate(-118,0)">
      <circle cx="0" cy="0" r="33" fill="url(#gold)"/>
      <path d="M -21 -15 A 26 26 0 1 0 21 -15 L 9 -28 L -9 -28 Z"
            fill="#e8e8e8" stroke="#7d4d00" stroke-width="3"/>
      <circle cx="0" cy="4" r="16" fill="#b8471f" stroke="#7a2f10" stroke-width="2.5"/>
    </g>
    <!-- Fourche -->
    <g transform="translate(86,0)" fill="url(#gold)">
      <path d="M 0 -30 L 37 -30 L 37 -13 L 18 -13 L 18 14 L 37 14 L 37 31 L 0 31 Z"/>
    </g>
  </g>
</svg>
